<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者情報登録</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./css/ui.css?v=1">
    <link rel="stylesheet" href="./css/style.css?v=2001">

    <!-- LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script type="module" src="./js/liff.js?v=2001"></script>
    <script src="./js/api.js?v=2001"></script>

    <style>
        .privacy-policy-wrap {
            margin-bottom: 16px;
        }
        .privacy-policy-wrap p {
            font-size: 13px;
            margin-bottom: 8px;
            color: #555;
        }
        .privacy-policy-wrap a {
            color: #06c755;
            text-decoration: underline;
        }
        .privacy-checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            cursor: pointer;
            color: #333;
        }
        .privacy-checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #06c755;
            cursor: pointer;
        }

        #btnSubmit {
            transition: background-color 0.2s, opacity 0.2s;
        }

        #btnSubmit.disabled {
            background-color: #ccc !important;
            color: #fff !important;
            cursor: not-allowed !important;
            pointer-events: none;
        }
    </style>
</head>

<body>

<h2>管理者情報登録</h2>

<div class="form-container">
    <label>氏名</label>
    <input id="name" class="form-input" type="text">

    <label>メールアドレス</label>
    <input id="email" class="form-input" type="email">

    <label>組織名（会社名）</label>
    <input id="org" class="form-input" type="text">

    <!-- Privacy Policy -->
    <div class="privacy-policy-wrap">
        <p>
            <a href="https://minnanobousaisouko.com/%E3%83%97%E3%83%A9%E3%82%A4%E3%83%90%E3%82%B7%E3%83%BC%E3%83%9D%E3%83%AA%E3%82%B7%E3%83%BC" target="_blank">
                プライバシーポリシー
            </a>をご確認ください。
        </p>
        <input type="checkbox" id="agreeCheckbox" onchange="btnSubmit.disabled = !this.checked">
        <label>同意する</label>
    </div>
    <button class="btn btn-green" id="btnSubmit" disabled>
        登録する
    </button>
</div>


<div id="msgArea"></div>
<div id="debugArea" class="debug"></div>

<!-- ✅ ALL JS safely after DOM -->
<script type="module">

import { renderHeader, renderFooter } from "./js/ui.js?v=1";
import { initLiff, getUserProfile, debug } from "./js/liff.js?v=2001";

renderHeader("みんなの防災倉庫管理");
renderFooter();

let lineId = null;

// ===  Checkbox Control ===
const checkbox = document.getElementById("agreeCheckbox");
const btn = document.getElementById("btnSubmit");

checkbox.addEventListener("change", () => {
    btn.disabled = !checkbox.checked;
    btn.classList.toggle("disabled", !checkbox.checked);
});

// ============================
// LIFF INIT
// ============================
async function main() {
    debug("=== register_admin start ===");

    const ok = await initLiff();
    if (!ok) return;

    const profile = await getUserProfile();
    lineId = profile.userId;

    debug("LINE Profile OK");

    const res = await getAdmin(lineId);

    if (res.result === "success" &&
        Array.isArray(res.items) &&
        res.items.length > 0) {

        const admin = res.items[0];

        document.getElementById("name").value  = admin.name ?? "";
        document.getElementById("email").value = admin.email ?? "";
        document.getElementById("org").value   = admin.organization ?? "";
    }
}

// ============================
// SUBMIT
// ============================
btn.addEventListener("click", async () => {

    if (!checkbox.checked) return;

    const payload = {
        LINEID: lineId,
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        organization: document.getElementById("org").value
    };

    debug("registerAdmin payload processing");

    const res = await registerAdmin(payload);

    if (res.result === "success") {
        document.getElementById("msgArea").innerHTML =
            "<p class='ok'>登録が完了しました。戻ります...</p>";

        setTimeout(() => location.href = "./index.html", 1200);
        return;
    }

    document.getElementById("msgArea").innerHTML =
        "<p class='error'>登録に失敗しました。</p>";
});

// ============================
main();

</script>

</body>
</html>
